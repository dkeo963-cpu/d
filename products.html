<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { box-sizing: border-box; }
        
        /* =========================
           GLOBAL BACKGROUND IMAGE
        ========================= */
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background-image: url('a.jfif'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            padding: 6px 12px;
            color: #333;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease-in-out;
        }

        .nav-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(13, 110, 253, 0.15);
            border-color: #b6d4fe;
            color: #0d6efd;
        }

        /* =========================
           HEADER SECTION (BLUE TITLE)
        ========================= */
        .page-header {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.9), rgba(8, 66, 152, 0.9));
            backdrop-filter: blur(4px);
            color: white;
            padding: 45px 20px;
            text-align: center;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        /* =========================
           PRODUCT CARDS
        ========================= */
        .products-section { 
            padding: 25px 15px 40px; 
        }

        .product-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(226, 226, 226, 0.8);
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: 0.25s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.98);
        }

        .product-img-container {
            width: 100%;
            height: 180px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #eee;
            overflow: hidden;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .product-description {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-stock {
            font-size: 11px;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 17px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        /* =========================
           LOADING & ERROR
        ========================= */
        #loading {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
        }
        #error { 
            display: none; 
            max-width: 700px; 
            margin: 0 auto 30px; 
        }

        /* =========================
           FOOTER
        ========================= */
        footer {
            background: rgba(32, 36, 42, 0.95);
            backdrop-filter: blur(6px);
            color: white;
            padding: 30px 15px;
            margin-top: 30px;
        }
        footer p { 
            margin: 0; 
            text-align: center; 
            color: #bbb; 
        }

        /* =========================
           RESPONSIVE MOBILE ADJUSTMENTS
        ========================= */
        @media (max-width: 768px) {
            .nav-btn {
                font-size: 12px;
                padding: 5px 10px;
            }
            .page-header {
                padding: 30px 15px;
            }
            .page-header h1 {
                font-size: 26px;
            }
            .products-section {
                padding: 15px 10px;
            }
            .product-img-container {
                height: 130px;
            }
            .product-body {
                padding: 10px;
            }
            .btn-sm-custom {
                padding: 5px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SUPABASE SCRIPT -->
<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://dfrqmwytnseckrcjrwca.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmcnFtd3l0bnNlY2tyY2pyd2NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTk3OTcsImV4cCI6MjEwMjYzNTc5N30.uVaBe7ze07SZbWtD7ygtLboyQD8n_3v_jlMae_N7Rnw";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const productContainer = document.getElementById("productContainer");
    const categoryTitle = document.getElementById("categoryTitle");

    const urlParams = new URLSearchParams(window.location.search);
    const categorySlug = urlParams.get("category");

    async function loadProducts() {
        if (loading) loading.style.display = "block";
        if (errorBox) errorBox.style.display = "none";
        if (productContainer) productContainer.innerHTML = "";

        try {
            let targetCategoryId = null;
            if (categorySlug) {
                const { data: catData, error: catErr } = await supabase
                    .from("categories")
                    .select("id, name")
                    .or(`slug.eq.${categorySlug},name.ilike.${categorySlug.replace(/-/g, " ")}`)
                    .maybeSingle();

                if (catErr) console.warn("Category lookup error:", catErr);

                if (catData) {
                    targetCategoryId = catData.id;
                    if (categoryTitle) categoryTitle.textContent = catData.name;
                } else {
                    if (categoryTitle) categoryTitle.textContent = categorySlug.replace(/-/g, " ");
                }
            } else if (categoryTitle) {
                categoryTitle.textContent = "All Products";
            }

            let query = supabase.from("products").select("*");
            if (targetCategoryId) {
                query = query.eq("category_id", targetCategoryId);
            }

            const { data, error } = await query;

            if (error) throw error;

            if (!data || data.length === 0) {
                productContainer.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-warning text-center">
                            No products found for this category.
                        </div>
                    </div>
                `;
                return;
            }

            data.forEach(product => {
                const card = document.createElement("div");
                card.className = "col-6 col-md-4 col-lg-3";

                const imgSrc = product.image || product.image_url || product.img_url || product.photo;
                const fallbackImage = "https://via.placeholder.com/400x300?text=No+Image+Available";

                const imageHTML = `<img src="${imgSrc || fallbackImage}" 
                                        alt="${product.name || 'Product'}" 
                                        style="width: 100%; height: 100%; object-fit: cover;"
                                        onerror="this.onerror=null; this.src='${fallbackImage}';">`;

                let desc = product.description || product.specifications || "High quality MEP tool.";
                if (typeof desc === "object") {
                    desc = JSON.stringify(desc).replace(/[{}"\\]/g, ' ');
                }

                const rawPrice = Number(product.price);
                const displayPrice = !isNaN(rawPrice) ? rawPrice.toFixed(2) : "0.00";

                // Stock Logic
                const stockCount = product.stock ?? 0;
                const isOutOfStock = stockCount <= 0;

                const stockBadge = isOutOfStock
                    ? `<span class="badge bg-danger product-stock">Out of Stock</span>`
                    : `<span class="badge bg-success product-stock">In Stock: ${stockCount}</span>`;

                const actionBtnHTML = `<button class="btn btn-outline-primary w-100 btn-sm-custom" onclick="event.stopPropagation(); goToDetail('${product.id}')">
                    <i class="bi bi-search"></i> Check Product
                   </button>`;

                card.innerHTML = `
                    <div class="product-card" onclick="goToDetail('${product.id}')">
                        <div class="product-img-container">
                            ${imageHTML}
                        </div>
                        <div class="product-body">
                            <div class="product-title">${product.name || 'Unnamed Product'}</div>
                            <div class="product-description">${desc}</div>
                            <div>${stockBadge}</div>
                            <div class="product-price">$${displayPrice}</div>
                            ${actionBtnHTML}
                        </div>
                    </div>
                `;

                productContainer.appendChild(card);
            });

        } catch (err) {
            console.error("Error loading products:", err);
            if (errorBox) {
                errorBox.style.display = "block";
                errorBox.innerHTML = `
                    <strong>Error loading products</strong><br>${err.message || err}
                `;
            }
        } finally {
            if (loading) loading.style.display = "none";
        }
    }

    // Function to navigate to Product Detail page
    window.goToDetail = function(productId) {
        window.location.href = `product-detail.html?id=${productId}`;
    };

    loadProducts();
</script>
